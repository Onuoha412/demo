<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Join a service queue from wherever you are, track your place in line, and get on with your day."
    />
    <meta name="theme-color" content="#10211b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QueueLess — Your time is yours again" />
    <meta
      property="og:description"
      content="Less waiting. More living. Join a queue online and know where you stand."
    />
    <title>QueueLess — Your time is yours again</title>
    <script>
      const fallbackPath = sessionStorage.getItem("queueless:pages-path");
      if (fallbackPath) {
        sessionStorage.removeItem("queueless:pages-path");
        if (fallbackPath.startsWith("/") && !fallbackPath.startsWith("//")) {
          history.replaceState(null, "", fallbackPath);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
